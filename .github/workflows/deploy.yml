name: Deploy to Oracle

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "24"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache wasm-pack
        id: cache-wasm-pack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ hashFiles('wasm/Cargo.lock') }}
          restore-keys: |
            wasm-pack-${{ runner.os }}-
      - name: Install wasm-pack
        if: steps.cache-wasm-pack.outputs.cache-hit != 'true'
        run: cargo install wasm-pack
      - name: Cache WASM build
        id: cache-wasm-build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wasm/pkg
          key: wasm-build-${{ runner.os }}-${{ hashFiles('wasm/Cargo.lock', 'wasm/src/**/*.rs') }}
          restore-keys: |
            wasm-build-${{ runner.os }}-
      - name: Build WASM
        if: steps.cache-wasm-build.outputs.cache-hit != 'true'
        run: |
          cd wasm
          wasm-pack build --target web --release
      - name: Copy WASM to src/lib/wasm
        run: |
          mkdir -p src/lib/wasm/pkg
          cp -r wasm/pkg/* src/lib/wasm/pkg/
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://tools.devstackio.com
      - name: Cleanup build artifacts
        run: npm run clean
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test tests/security.spec.ts tests/api.spec.ts
      - name: Run npm audit
        continue-on-error: true
        run: npm audit --audit-level=critical --omit=dev

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for secrets
        run: |
          echo "Checking for committed .env files..."
          if git ls-files | grep -q '\.env\.'; then
            echo "WARNING: .env files found in git tracking!"
            git ls-files | grep '\.env\.'
          fi

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [validate, security-scan]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    # Deploy runs over SSH; the workflow itself never pushes to the repo.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: ${{ secrets.ORACLE_PORT || 22 }}
          script: |
            set -e
            cd /var/www/tools

            # Create logs directory
            mkdir -p logs

            # Clean stale build artifacts from previous deploys
            rm -rf .next wasm/target test-results playwright-report node_modules/.cache

            # Pull latest changes
            git fetch origin
            git reset --hard origin/main

            # Install Rust and wasm-pack for WASM build (with caching)
            if [ ! -f "$HOME/.cargo/bin/rustc" ]; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            fi
            source "$HOME/.cargo/env"
            rustup target add wasm32-unknown-unknown

            if [ ! -f "$HOME/.cargo/bin/wasm-pack" ]; then
              cargo install wasm-pack
            fi

            # Build WASM module
            cd wasm
            wasm-pack build --target web --release
            cd ..

            # Copy WASM to src/lib/wasm for Next.js build
            mkdir -p src/lib/wasm/pkg
            cp -r wasm/pkg/* src/lib/wasm/pkg/

            # Create .env from GitHub Secrets
            # Values are injected at deploy time, never committed to git
            printf '%s\n' \
              'NEXT_PUBLIC_SITE_URL=https://tools.devstackio.com' \
              'NEXT_PUBLIC_CONTACT_EMAIL=contact@devstackio.com' \
              "NEXT_PUBLIC_GA_ID=${{ secrets.NEXT_PUBLIC_GA_ID }}" \
              "NEXT_PUBLIC_ADSENSE_PUBLISHER_ID=${{ secrets.NEXT_PUBLIC_ADSENSE_PUBLISHER_ID }}" \
              "IP_HASH_SALT=${{ secrets.IP_HASH_SALT }}" \
              "INDEXNOW_KEY=${{ secrets.INDEXNOW_KEY }}" \
              'PORT=3000' \
              'NODE_ENV=production' \
              'VISIT_COUNTER_PATH=/var/www/tools/data/visit-counter/visits.jsonl' \
              'SITEMAP_STATE_PATH=/var/www/tools/data/sitemap-state.json' > .env

            # Install dependencies and build
            npm ci
            npm run build

            # Cleanup build artifacts (keep standalone output)
            npm run clean

            # Prepare standalone output
            mkdir -p .next/standalone/.next
            cp -r .next/static .next/standalone/.next/
            cp -r public .next/standalone/
            mkdir -p .next/standalone/data
            cp -r data/. .next/standalone/data/

            # Verify CSS chunks exist before restart (prevents unstyled deployments)
            CSS_COUNT=$(find .next/standalone/.next/static/chunks -maxdepth 1 -name "*.css" -type f -size +0c | wc -l)
            if [ "$CSS_COUNT" -eq 0 ]; then
              echo "ERROR: No CSS chunks found in standalone output -- aborting deploy" >&2
              exit 1
            fi
            echo "Verified $CSS_COUNT CSS chunk(s) in standalone output"

            # CSP is issued per-request (nonce-based) by the Next.js middleware;
            # nginx must not add a second static CSP header. The generated map
            # (data/csp-hashes.json) is copied into the standalone output above.

            # Restart application (ecosystem app is named "devstackio"; "tools" is stale)
            pm2 delete tools 2>/dev/null || true
            pm2 restart devstackio || pm2 start ecosystem.config.js
            pm2 save

            # Verify deployment
            sleep 5
            curl -sf http://127.0.0.1:3000/api/health || exit 1
            curl -sf -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/ | grep -q 200 || { echo "ERROR: Homepage 500" >&2; exit 1; }

            # Verify the served CSP actually authorizes every inline script in
            # the served HTML. A mismatch here silently kills React hydration
            # (dead buttons, stuck "Loading tool..."), so fail the deploy.
            node scripts/verify-csp.mjs http://127.0.0.1:3000/

            # Best-effort sitemap + IndexNow submission (needs INDEXNOW_KEY + network)
            set +e
            ( . ./.env 2>/dev/null; node scripts/sitemap-submitter.mjs ) || echo "WARN: sitemap submission skipped"
            set -e
            echo "Deployment successful"