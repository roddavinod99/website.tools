name: Deploy to Oracle

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "20"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache wasm-pack
        id: cache-wasm-pack
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ hashFiles('wasm/Cargo.lock') }}
          restore-keys: |
            wasm-pack-${{ runner.os }}-
      - name: Install wasm-pack
        if: steps.cache-wasm-pack.outputs.cache-hit != 'true'
        run: cargo install wasm-pack
      - name: Cache WASM build
        id: cache-wasm-build
        uses: actions/cache@v4
        with:
          path: wasm/pkg
          key: wasm-build-${{ runner.os }}-${{ hashFiles('wasm/Cargo.lock', 'wasm/src/**/*.rs') }}
          restore-keys: |
            wasm-build-${{ runner.os }}-
      - name: Build WASM
        if: steps.cache-wasm-build.outputs.cache-hit != 'true'
        run: |
          cd wasm
          wasm-pack build --target web --release
      - name: Copy WASM to src/lib/wasm
        run: |
          mkdir -p src/lib/wasm/pkg
          cp -r wasm/pkg/* src/lib/wasm/pkg/
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://tools.devstackio.com
      - name: Cleanup build artifacts
        run: npm run clean
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test tests/security.spec.ts tests/api.spec.ts
      - name: Run npm audit
        continue-on-error: true
        run: npm audit --audit-level=critical --omit=dev

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
      - name: Check for secrets
        run: |
          echo "Checking for committed .env files..."
          if git ls-files | grep -q '\.env\.'; then
            echo "WARNING: .env files found in git tracking!"
            git ls-files | grep '\.env\.'
          fi

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [validate, security-scan]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Determine and apply version
        id: version
        run: |
          node scripts/auto-release.mjs
      - name: Sync package-lock.json
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit and tag
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          git add -A
          git diff --cached --quiet || git commit -m "release: v${NEW_VERSION} [skip ci]"
          git tag "v${NEW_VERSION}"
          git push origin main --tags
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: ${{ secrets.ORACLE_PORT || 22 }}
          script: |
            set -e
            cd /var/www/tools

            # Create logs directory
            mkdir -p logs

            # Clean stale build artifacts from previous deploys
            rm -rf .next wasm/target test-results playwright-report node_modules/.cache

            # Pull latest changes
            git fetch origin
            git reset --hard origin/main

            # Install Rust and wasm-pack for WASM build (with caching)
            if [ ! -f "$HOME/.cargo/bin/rustc" ]; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            fi
            source "$HOME/.cargo/env"
            rustup target add wasm32-unknown-unknown

            if [ ! -f "$HOME/.cargo/bin/wasm-pack" ]; then
              cargo install wasm-pack
            fi

            # Build WASM module
            cd wasm
            wasm-pack build --target web --release
            cd ..

            # Copy WASM to src/lib/wasm for Next.js build
            mkdir -p src/lib/wasm/pkg
            cp -r wasm/pkg/* src/lib/wasm/pkg/

            # Create .env from GitHub Secrets
            # Values are injected at deploy time, never committed to git
            printf '%s\n' \
              'NEXT_PUBLIC_SITE_URL=https://tools.devstackio.com' \
              'NEXT_PUBLIC_CONTACT_EMAIL=contact@devstackio.com' \
              "NEXT_PUBLIC_GA_ID=${{ secrets.NEXT_PUBLIC_GA_ID }}" \
              "NEXT_PUBLIC_ADSENSE_PUBLISHER_ID=${{ secrets.NEXT_PUBLIC_ADSENSE_PUBLISHER_ID }}" \
              "IP_HASH_SALT=${{ secrets.IP_HASH_SALT }}" \
              'PORT=3000' \
              'NODE_ENV=production' > .env

            # Install dependencies and build
            npm ci
            npm run build

            # Cleanup build artifacts (keep standalone output)
            npm run clean

            # Prepare standalone output
            mkdir -p .next/standalone/.next
            cp -r .next/static .next/standalone/.next/
            cp -r public .next/standalone/
            mkdir -p .next/standalone/data
            cp -r data/. .next/standalone/data/

            # Verify CSS chunks exist before restart (prevents unstyled deployments)
            CSS_COUNT=$(find .next/standalone/.next/static/chunks -maxdepth 1 -name "*.css" -type f -size +0c | wc -l)
            if [ "$CSS_COUNT" -eq 0 ]; then
              echo "ERROR: No CSS chunks found in standalone output -- aborting deploy" >&2
              exit 1
            fi
            echo "Verified $CSS_COUNT CSS chunk(s) in standalone output"

            # Restart application (ecosystem app is named "devstackio"; "tools" is stale)
            pm2 restart devstackio || pm2 start ecosystem.config.js
            pm2 save

            # Verify deployment
            sleep 5
            curl -sf http://localhost:3000/api/health || exit 1
            curl -sf -o /dev/null -w "%{http_code}" http://localhost:3000/ | grep -q 200 || { echo "ERROR: Homepage 500" >&2; exit 1; }
            echo "Deployment successful"