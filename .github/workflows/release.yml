name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Resolve version
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "v${{ steps.meta.outputs.version }}"
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false
          body: |
            Release **v${{ steps.meta.outputs.version }}** of Website.Tools.

            Automated release notes were generated from the merged commits. For
            the full changelog, see
            [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).

            - Status page: https://tools.devstackio.com/status
            - Changelog page: https://tools.devstackio.com/changelog
          fail_on_unmatched_files: true