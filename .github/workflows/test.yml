name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "24"

jobs:
  quality:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint

  unit:
    name: Unit & Version Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  e2e:
    name: E2E, API & A11y (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://tools.devstackio.com
      - name: Prepare standalone output
        run: |
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/
          cp -r public .next/standalone/
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Run Playwright (e2e, tools, API, security, a11y)
        run: npx playwright test tests/a11y.spec.ts tests/tools.spec.ts tests/api.spec.ts tests/security.spec.ts
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: Readiness & SEO Audit (advisory)
    runs-on: ubuntu-latest
    needs: e2e
    # Heavy advisory scan; only run when public to avoid burning private minutes.
    if: always() && github.repository_visibility == 'public'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Production readiness
        continue-on-error: true
        run: npm run production:readiness
      - name: SEO audit
        continue-on-error: true
        run: npm run seo:audit