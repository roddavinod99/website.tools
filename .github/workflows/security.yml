name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'

jobs:
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security tests
        run: npm run test:security

      - name: Upload security test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-test-results
          path: test-results/
          retention-days: 7

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (high/critical)
        run: npm audit --audit-level=high --json > audit-report.json || true

      - name: Check for high/critical vulnerabilities
        run: |
          HIGH_CRITICAL=$(cat audit-report.json | jq '.metadata.vulnerabilities.high + .metadata.vulnerabilities.critical')
          if [ "$HIGH_CRITICAL" -gt 0 ]; then
            echo "::error::Found $HIGH_CRITICAL high/critical vulnerabilities"
            cat audit-report.json | jq '.vulnerabilities[] | select(.severity == "high" or .severity == "critical") | {name: .name, severity: .severity, via: .via}'
            exit 1
          fi
          echo "No high/critical vulnerabilities found"

      - name: Upload audit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-audit-report
          path: audit-report.json
          retention-days: 30

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    # GHAS/CodeQL is not available on free private repos; only run when public.
    if: github.repository_visibility == 'public'
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          category: "/language:${{ matrix.language }}"

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint check
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://tools.devstackio.com
          IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}

  security-headers-check:
    name: Security Headers Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://tools.devstackio.com
          IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}

      - name: Start server
        run: |
          npm run start &
          sleep 10
        env:
          NEXT_PUBLIC_SITE_URL: https://tools.devstackio.com
          IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}

      - name: Check security headers
        run: |
          HEADERS=$(curl -s -I http://localhost:3000/ | tr -d '\r')
          echo "Response headers:"
          echo "$HEADERS"

          REQUIRED_HEADERS=(
            "x-content-type-options: nosniff"
            "x-frame-options: SAMEORIGIN"
            "strict-transport-security"
            "content-security-policy"
            "cross-origin-opener-policy: same-origin"
            "cross-origin-resource-policy: same-origin"
            "referrer-policy"
            "permissions-policy"
          )

          for header in "${REQUIRED_HEADERS[@]}"; do
            if echo "$HEADERS" | grep -qi "$header"; then
              echo "✓ Found: $header"
            else
              echo "✗ Missing: $header"
              exit 1
            fi
          done

          CSP=$(echo "$HEADERS" | grep -i "content-security-policy:" | cut -d' ' -f2-)
          if echo "$CSP" | grep -qi "unsafe-inline"; then
            echo "✗ CSP contains unsafe-inline"
            exit 1
          fi
          if echo "$CSP" | grep -qi "unsafe-eval"; then
            echo "✗ CSP contains unsafe-eval"
            exit 1
          fi
          echo "✓ CSP does not contain unsafe-inline or unsafe-eval"

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          config-file: '.github/dependency-review-config.yml'
          fail-on-severity: high
