name: Lighthouse CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@72f881228236981b625ed765b928efb1786a1f55 # v11
        with:
          urls: |
            https://tools.devstackio.com
            https://tools.devstackio.com/tools
            https://tools.devstackio.com/tools/json-formatter
          budgetPath: ./lighthouse-budget.json
          uploadArtifacts: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Find the latest lighthouse results
            const resultsDir = '.lighthouseci';
            if (!fs.existsSync(resultsDir)) {
              console.log('No Lighthouse results found');
              return;
            }
            
            const runs = fs.readdirSync(resultsDir).filter(f => f.startsWith('run_')).sort().reverse();
            if (runs.length === 0) return;
            
            const latestRun = runs[0];
            const runPath = path.join(resultsDir, latestRun);
            const htmlFiles = fs.readdirSync(runPath).filter(f => f.endsWith('.html'));
            
            let comment = '## 📊 Lighthouse CI Results\n\n';
            
            for (const htmlFile of htmlFiles) {
              const urlMatch = htmlFile.match(/^(.+)-report\.html$/);
              const url = urlMatch ? decodeURIComponent(urlMatch[1]) : htmlFile;
              comment += `- [${url}](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}/artifacts) (artifact)\n`;
            }
            
            comment += '\n*Note: This is a non-blocking check. Deployment proceeds regardless of scores.*';
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });