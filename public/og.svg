<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0A0A0A" />

  <!-- Centered logomark (256x256), drawn natively at 256x256 for crispness -->
  <g transform="translate(472 90)" fill="none" stroke="#FAFAFA" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- D: vertical bar + curved right (scaled to 256x256 from 64x64 logomark; multiply coords by 4) -->
    <path d="M56 56 L56 200" />
    <path d="M56 56 L104 56 Q152 56 152 128 Q152 200 104 200 L56 200" />
    <!-- I: vertical bar -->
    <path d="M200 56 L200 200" />
  </g>

  <!-- Wordmark -->
  <text x="600" y="470" font-size="64" font-weight="700" fill="#FAFAFA" text-anchor="middle" letter-spacing="-1">DevStackIO Tools</text>

  <!-- Sub-text -->
  <text x="600" y="520" font-size="28" font-weight="400" fill="#A1A1AA" text-anchor="middle">Free, private, browser-only developer tools.</text>
</svg>